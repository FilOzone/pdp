name: Makefile CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Dependencies
        run: |
          forge install

      - name: Run build
        run: |
          make build;

      - name: Run tests
        run: |
          make test;

      - name: Run fast profile tests
        run: |
          make test-fast;

      - name: Check storage layout
        run: |
          make check-layout;
