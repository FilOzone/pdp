[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.30"

# For dependencies
remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
    'forge-std/=lib/forge-std/src/',
    '@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/',
]

optimizer_runs = 1
via_ir = true

[profile.fast]
out = 'out-fast'
cache_path = 'cache-fast'
optimizer = false
via_ir = false

[profile.default.lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    "block-timestamp",
    "custom-errors",
    "incorrect-shift",
    "interface-naming",
    "mixed-case-function",
    "multi-contract-file",
    "unsafe-typecast",
]
